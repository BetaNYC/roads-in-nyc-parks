project:
  type: website
  resources: 
    - images
    - output
  output-dir: docs
  # What's changed page (BetaNYC standard): rebuild whats-changed.qmd from WHATS-CHANGED.md
  # before every render. scripts/whats_changed.py is a copy from the BetaNYC workspace;
  # never edit it here.
  pre-render: python3 scripts/whats_changed.py render WHATS-CHANGED.md --format quarto --out whats-changed.qmd --repo-url https://github.com/BetaNYC/roads-in-nyc-parks

website:
  navbar: false
  favicon: images/logos/RADAR.svg
format:
  html:
    theme:
      - cosmo
      - brand
    css:
      - style/cil-theme.css
    toc: false
    include-before-body: radar-header.html
    include-after-body: radar-footer.html
    fig-format: svg
    fig-dpi: 300
    fig-width: 12
    fig-asp: 0.618
execute:
  freeze: false
  message: false